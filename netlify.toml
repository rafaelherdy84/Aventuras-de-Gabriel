[build]
  publish = "dist"
  command = "npm run build"

# Garantir que manifest.json e service-worker.js tenham os headers corretos para PWA
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"

# Cache de longa duração para arquivos estáticos com hash
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirecionamento SPA para evitar 404 ao recarregar rotas
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
