<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / card -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="16" filter="url(#shadow)"/>

  <!-- Sparkles & Stars in background -->
  <g fill="#fde047" opacity="0.85">
    <circle cx="95" cy="110" r="10" />
    <path d="M 95 90 L 98 105 L 113 108 L 98 111 L 95 126 L 92 111 L 77 108 L 92 105 Z" fill="#ffffff" />
    <circle cx="410" cy="140" r="14" />
    <path d="M 410 115 L 414 135 L 434 139 L 414 143 L 410 163 L 406 143 L 386 139 L 406 135 Z" fill="#fde047" />
    <circle cx="420" cy="380" r="8" fill="#38bdf8" />
    <circle cx="85" cy="390" r="11" fill="#4ade80" />
  </g>

  <!-- Giant Golden Star Halo behind Gabriel -->
  <circle cx="256" cy="235" r="140" fill="url(#starGlow)" opacity="0.35"/>

  <!-- Gabriel Character Art -->
  <!-- Shoulders & Black Jacket -->
  <path d="M 120 440 C 120 350, 392 350, 392 440 L 410 490 L 102 490 Z" fill="#18181b" />
  <!-- Jacket Orange Zipper & Collar -->
  <path d="M 220 365 L 256 410 L 292 365 Z" fill="#f97316" />
  <line x1="256" y1="410" x2="256" y2="490" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
  <!-- Gold Crown Emblem on Jacket -->
  <path d="M 170 410 L 170 398 L 180 405 L 190 395 L 200 405 L 210 398 L 210 410 Z" fill="#facc15"/>

  <!-- Neck -->
  <rect x="234" y="320" width="44" height="50" fill="#fcd34d" rx="10"/>

  <!-- Gabriel Face -->
  <ellipse cx="256" cy="245" rx="105" ry="105" fill="#fde047"/>
  <!-- Rosy cheeks -->
  <circle cx="185" cy="270" r="22" fill="#f43f5e" opacity="0.45"/>
  <circle cx="327" cy="270" r="22" fill="#f43f5e" opacity="0.45"/>

  <!-- Big joyful cartoon eyes -->
  <ellipse cx="205" cy="230" rx="25" ry="34" fill="#ffffff"/>
  <ellipse cx="307" cy="230" rx="25" ry="34" fill="#ffffff"/>
  <ellipse cx="210" cy="232" rx="17" ry="24" fill="#451a03"/>
  <ellipse cx="312" cy="232" rx="17" ry="24" fill="#451a03"/>
  <circle cx="212" cy="232" r="11" fill="#090d16"/>
  <circle cx="314" cy="232" r="11" fill="#090d16"/>
  <!-- Eye sparkles -->
  <circle cx="204" cy="222" r="7.5" fill="#ffffff"/>
  <circle cx="306" cy="222" r="7.5" fill="#ffffff"/>
  <circle cx="215" cy="238" r="4" fill="#ffffff"/>
  <circle cx="317" cy="238" r="4" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M 180 195 Q 210 190 232 200" stroke="#18181b" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 332 195 Q 302 190 280 200" stroke="#18181b" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Cute big smile -->
  <path d="M 225 278 Q 256 312 287 278" stroke="#991b1b" stroke-width="9" stroke-linecap="round" fill="#ef4444"/>

  <!-- Gabriel's black stylish swept hair -->
  <path d="M 148 215 C 130 115, 382 115, 364 215 C 378 170, 340 100, 256 94 C 172 94, 134 170, 148 215 Z" fill="#18181b"/>
  <path d="M 152 200 C 175 145, 240 140, 268 160 C 295 145, 350 160, 358 205 C 330 172, 285 168, 245 184 C 205 168, 172 178, 152 200 Z" fill="#18181b"/>
  <!-- Hair gloss highlight -->
  <path d="M 200 128 Q 256 112 298 124" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Front Golden Star badge floating at bottom right -->
  <g transform="translate(355, 355) scale(0.95)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="45" fill="#facc15" stroke="#f59e0b" stroke-width="4"/>
    <polygon points="50,15 61,38 85,38 66,54 73,78 50,63 27,78 34,54 15,38 39,38" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  </g>
</svg>
